name: Universal Reusable GitOps CI/CD Pipeline

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
        description: "Nome único da aplicação"
      app_type:
        required: false
        type: string
        default: "docker"
        description: "Tipo da aplicação: php, nodejs, python, go, docker"
      k8s_manifests_dir:
        required: false
        type: string
        default: "k8s"
        description: "Diretório de manifestos Kubernetes no repositório"
      dockerfile_path:
        required: false
        type: string
        default: "docker/Dockerfile"
        description: "Caminho relativo para o Dockerfile"
      image_name:
        required: false
        type: string
        default: ""
        description: "Nome da imagem no registry (ex: ghcr.io/org/repo)"
    secrets:
      REGISTRY_TOKEN:
        required: false
      ARGOCD_TOKEN:
        required: false

jobs:
  lint-and-quality:
    name: 🔍 Lint & Validação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Validar Sintaxe dos Manifestos Kubernetes
        run: |
          if [ -d "${{ inputs.k8s_manifests_dir }}" ]; then
            kubectl kustomize "${{ inputs.k8s_manifests_dir }}" > /dev/null || kubectl apply --dry-run=client -f "${{ inputs.k8s_manifests_dir }}"
            echo "✔ Manifestos Kubernetes válidos!"
          fi

  security-scan:
    name: 🛡️ Varredura SAST & Segredos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar ausência de segredos óbvios
        run: |
          BAD_PATTERNS="(AIzaSy[A-Za-z0-9_-]{33}|ghp_[A-Za-z0-9]{36}|glpat-[A-Za-z0-9_-]{20}|-----BEGIN (RSA|EC|DSA|OPENSSH) PRIVATE KEY-----)"
          if git grep -E -I "$BAD_PATTERNS" -- ':!*.lock' ':!*.sample' ':!*.example' > /dev/null 2>&1; then
            echo "❌ ERRO: Segredo ou chave privada detectada no repositório!"
            exit 1
          fi
          echo "✔ Repositório limpo de segredos hardcoded."

  build-and-push:
    name: 🐳 Docker Build & Tagging
    needs: [lint-and-quality, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determinar Tags da Imagem
        id: meta
        run: |
          REF="${{ github.ref_name }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          echo "tag=${REF}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build da Imagem Docker
        run: |
          IMG="${{ inputs.image_name != '' && inputs.image_name || inputs.app_name }}"
          docker build -t "${IMG}:${{ steps.meta.outputs.short_sha }}" -t "${IMG}:latest" -f "${{ inputs.dockerfile_path }}" .
          echo "✔ Build da imagem Docker concluído com sucesso!"
