<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Omniflowti — Portal Unificado Corporativo. Centralize todas as aplicações da empresa em um único ponto de acesso." />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="theme-color" content="#0B0A0A" />

    <title>Flowti Hub — Portal Unificado</title>

    <!-- Favicon & PWA -->
    <link rel="icon" type="image/svg+xml" href="/assets/img/pwa-icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flowti Hub" />
    <link rel="apple-touch-icon" href="/assets/img/pwa-icon.svg" />

    <!-- Google Fonts: Inter, JetBrains Mono, Space Grotesk, Poppins, Raleway, Rubik -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&family=Raleway:wght@400;500;600;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Remix Icon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />

    <!-- App Styles -->
    <link rel="stylesheet" href="/assets/css/app.css?v=1.5.0" />

    <!-- Theme Restore & Action Route (Anti-FOUC) -->
    <script>
        (function() {
            if (window.location.search.includes('action=login') && !window.location.hash) {
                window.location.hash = '#/login';
            }
            var theme = localStorage.getItem('omniflowti_theme') || 'aura';
            if (!theme || theme === 'dark' || theme === 'aura' || theme === 'light' || theme === 'flowti-light' || theme === 'safira-light' || theme === 'classic-corp-light' || theme === 'warm-minimalist' || theme === 'cobalt-light') {
                theme = 'aura';
            } else if (theme === 'ocean') {
                theme = 'mv-petrol';
            } else if (theme === 'sunset') {
                theme = 'mv-teal';
            } else if (theme === 'midnight') {
                theme = 'flowti-midnight';
            } else if (theme === 'cobalt-dark') {
                theme = 'safira-dark';
            } else if (theme === 'solar-terracotta') {
                theme = 'terracotta-sunset';
            }
            document.documentElement.setAttribute('data-theme', theme);
            var density = localStorage.getItem('omniflowti_density');
            if (density === 'compact') {
                document.documentElement.classList.add('density-compact');
            }
        })();
    </script>
</head>
<body>
    <!-- App Root -->
    <div id="app">
        <!-- Loading inicial -->
        <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 16px;">
            <i class="ri-global-line" style="font-size: 3rem; color: var(--theme-primary); animation: pulse-glow 2s ease-in-out infinite;"></i>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Carregando Omniflowti...</p>
        </div>
    </div>

    <!-- JavaScript Modules -->
    <script src="/assets/js/state.js?v=1.4.1"></script>
    <script src="/assets/js/api.js?v=1.4.1"></script>
    <script src="/assets/js/router.js?v=1.4.1"></script>
    <script src="/assets/js/components/Toast.js?v=1.4.1"></script>
    <script src="/assets/js/components/Modal.js?v=1.4.1"></script>
    <script src="/assets/js/components/ThemeManager.js?v=1.4.1"></script>
    <script src="/assets/js/components/NotificationManager.js?v=1.4.1"></script>
    <script src="/assets/js/components/BroadcastBanner.js?v=1.4.1"></script>
    <script src="/assets/js/components/CommandPalette.js?v=1.4.1"></script>
    <script src="/assets/js/components/Sidebar.js?v=1.5.0"></script>
    <script src="/assets/js/components/Topbar.js?v=1.5.0"></script>
    <script src="/assets/js/components/LoginForm.js?v=1.5.0"></script>
    <script src="/assets/js/components/Dashboard.js?v=1.4.1"></script>
    <script src="/assets/js/components/PanelManager.js?v=1.4.1"></script>
    <script src="/assets/js/components/UserManager.js?v=1.4.1"></script>
    <script src="/assets/js/components/GroupManager.js?v=1.4.1"></script>
    <script src="/assets/js/app.js?v=1.4.1"></script>

    <!-- PWA Service Worker Registration & Install Prompt -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.debug('[PWA] Service Worker ativo:', reg.scope))
                    .catch(err => console.debug('[PWA] Falha ao registrar Service Worker:', err));
            });
        }

        // Captura evento de instalação para permitir instalação sob demanda
        window.deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            window.deferredPrompt = e;
            window.dispatchEvent(new CustomEvent('pwa-installable'));
        });
    </script>
</body>
</html>
