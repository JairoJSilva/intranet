<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 40" width="220" height="40">
    <defs>
        <linearGradient id="portalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="50%" stop-color="#818cf8" />
            <stop offset="100%" stop-color="#c084fc" />
        </linearGradient>
        <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Icon: Modern Corporate Portal Gate -->
    <g transform="translate(6, 4)">
        <!-- Outer Glowing Ring/Hexagon -->
        <polygon points="16,2 29,9.5 29,24.5 16,32 3,24.5 3,9.5" 
                 fill="none" stroke="url(#portalGrad)" stroke-width="2.5" stroke-linejoin="round" />
        <!-- Inner Geometric Core -->
        <polygon points="16,8 23,12 23,20 16,24 9,20 9,12" 
                 fill="url(#portalGrad)" fill-opacity="0.25" stroke="url(#portalGrad)" stroke-width="1.5" stroke-linejoin="round" />
        <!-- Center Spark -->
        <circle cx="16" cy="16" r="3.5" fill="#ffffff" filter="url(#glow)" />
    </g>

    <!-- Brand Typography -->
    <g transform="translate(48, 26)">
        <text font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Inter', sans-serif" 
              font-size="17" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">PORTAL</text>
        <text x="75" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Inter', sans-serif" 
              font-size="16" font-weight="600" fill="url(#glowGrad)" letter-spacing="2">UNIFICADO</text>
    </g>
</svg>
