<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08131a"/>
      <stop offset="100%" stop-color="#142835"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0e6"/>
      <stop offset="50%" stop-color="#00c4bf"/>
      <stop offset="100%" stop-color="#0165aa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#00c4bf" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Flowti / Portal Stylized Icon -->
  <g transform="translate(256, 256) scale(1.1)" filter="url(#glow)">
    <!-- Outer Ring Orbit -->
    <ellipse rx="140" ry="50" fill="none" stroke="url(#primaryGrad)" stroke-width="12" transform="rotate(-30)" stroke-dasharray="12 8" opacity="0.85"/>
    <ellipse rx="140" ry="50" fill="none" stroke="url(#primaryGrad)" stroke-width="12" transform="rotate(45)" opacity="0.5"/>
    
    <!-- Central Globe Core -->
    <circle r="72" fill="#08131a" stroke="url(#primaryGrad)" stroke-width="14"/>
    <circle r="46" fill="url(#primaryGrad)"/>
    
    <!-- Pulse Center -->
    <circle r="22" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
