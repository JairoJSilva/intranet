version: '3.8'

# ============================================
# Portal Unificado — Docker Compose
# Ambiente de desenvolvimento local
# ============================================

services:
  # ---- Aplicação PHP ----
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: intranet-app
    ports:
      - "8080:80"
    volumes:
      - ../aplicação:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=intranet_db
      - DB_USER=root
      - DB_PASS=rootpass
      - APP_ENV=development
      - APP_URL=http://localhost:8080
      - APP_SECRET=dev-docker-secret-key
      - SESSION_LIFETIME=7200
      - LDAP_ENABLED=false
    networks:
      - intranet-net
    restart: unless-stopped

  # ---- MySQL 8.0 ----
  mysql:
    image: mysql:8.0
    container_name: intranet-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: intranet_db
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - intranet-net
    restart: unless-stopped

  # ---- phpMyAdmin (Dev only) ----
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: intranet-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpass
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - intranet-net
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  intranet-net:
    driver: bridge
