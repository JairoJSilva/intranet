name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-quality:
    name: 🔍 Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, json, ldap
          tools: composer:v2

      - name: Validate composer.json
        run: |
          cd aplicação
          composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: aplicação/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('aplicação/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          cd aplicação
          composer install --prefer-dist --no-progress --no-interaction

      - name: PHP Syntax Check (Lint)
        run: |
          echo "Verificando sintaxe PHP em aplicação/..."
          find aplicação/src aplicação/public -name "*.php" -print0 | xargs -0 -n1 -P4 php -l

  test-database:
    name: 🧪 Test & Database Validation
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: intranet_flowti_test
          MYSQL_USER: flowti_test
          MYSQL_PASSWORD: flowti_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, json, ldap
          tools: composer:v2

      - name: Install Composer dependencies
        run: |
          cd aplicação
          composer install --prefer-dist --no-progress --no-interaction

      - name: Validate Database Schema & Seed
        run: |
          echo "Testando execução do schema SQL..."
          mysql -h 127.0.0.1 -P 3306 -u flowti_test -pflowti_password intranet_flowti_test < database/schema.sql
          echo "Testando execução dos seeds SQL..."
          mysql -h 127.0.0.1 -P 3306 -u flowti_test -pflowti_password intranet_flowti_test < database/seed.sql
          echo "Banco de dados inicializado com sucesso!"

      - name: Run Tests (se configurado)
        run: |
          cd aplicação
          if [ -f "vendor/bin/phpunit" ]; then
            ./vendor/bin/phpunit --colors=always
          else
            echo "Nenhum teste PHPUnit configurado ainda. Etapa validada com sucesso."
          fi

  docker-build:
    name: 🐳 Docker Build & Push (GHCR)
    needs: [lint-and-quality, test-database]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=true

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
