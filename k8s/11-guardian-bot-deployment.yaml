apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-guardian
  namespace: intranet
  labels:
    app.kubernetes.io/name: pipeline-guardian
    app.kubernetes.io/part-of: omniflowti
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pipeline-guardian
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pipeline-guardian
        app.kubernetes.io/part-of: omniflowti
    spec:
      serviceAccountName: pipeline-guardian
      containers:
        - name: guardian-bot
          image: pipeline-guardian:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--daemon"
            - "--namespace"
            - "intranet"
            - "--interval"
            - "15"
            - "--port"
            - "9090"
          ports:
            - containerPort: 9090
              name: http-dash
          env:
            - name: WATCH_NAMESPACE
              value: "intranet"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: pipeline-guardian-service
  namespace: intranet
  labels:
    app.kubernetes.io/name: pipeline-guardian
    app.kubernetes.io/part-of: omniflowti
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      name: http-dash
  selector:
    app.kubernetes.io/name: pipeline-guardian
